{% extends "base.html" %}

{% block content %}
<h2>Login</h2>

<form method="post" action="/login-web">
    <input name="username" placeholder="Username"><br>
    <input name="password" type="password" placeholder="Password"><br>
    <button type="submit">Login</button>
</form>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

{% endblock %}
