<!DOCTYPE html>
<html>
<head>
    <title>yFitOps</title>
</head>
<body>

<h1>🎵 yFitOps: like Spotify but better</h1>

{% if user %}
    <p>Logged in as: {{ user.username }}</p>
    <a href="/">Main page</a> |
    <a href="/songs-ui">Songs</a> |
    <a href="/logout">Logout</a>
{% else %}

    <a href="/login">Login</a> |
    <a href="/register">Register</a>
{% endif %}

<hr>

{% block content %}{% endblock %}

</body>
</html>
